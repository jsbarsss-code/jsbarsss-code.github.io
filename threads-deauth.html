<body><main><h1 style="font-size:22px">쓰레드 연결 해제</h1><p>쓰레드에서 이 앱 연결을 해제하면 자동 게시가 멈춥니다. 이 앱은 게시에 필요한 접근 토큰 외에 사용자 데이터를 저장하지 않으며, 토큰은 운영자의 비공개 저장소 Secret에만 있습니다. 연결 해제 시 토큰은 더 이상 사용할 수 없습니다.</p></main></body></html>

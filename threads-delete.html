<body><main><h1 style="font-size:22px">쓰레드 데이터 삭제 안내</h1><p>이 앱(우리집 열쇠 자동 게시)은 운영자 본인 계정에 글을 올리는 용도로만 쓰이며, 쓰레드 사용자 데이터를 수집·저장하지 않습니다. 저장되는 것은 게시에 필요한 접근 토큰 하나(운영자 비공개 저장소 Secret)뿐입니다. 삭제를 원하시면 쓰레드 설정 → 계정 → 웹사이트 권한에서 앱을 제거하세요. 그러면 토큰이 무효화됩니다. 문의: jsbars 블로그(https://blog.naver.com/jsbars) 댓글.</p></main></body></html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>쓰레드 연결</title>
<style>
:root{--bg:#f3f5f2;--paper:#fff;--ink:#17251f;--muted:#4a5751;--line:#d6ddd8;--accent:#1f6b4f}
@media (prefers-color-scheme:dark){:root{--bg:#101814;--paper:#17221d;--ink:#eef4f0;--muted:#b3c2ba;--line:#2c3a33;--accent:#5fc39a}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Malgun Gothic",sans-serif;line-height:1.7}
main{max-width:560px;margin:0 auto;padding:24px 16px;display:grid;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
input,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
textarea{min-height:110px;word-break:break-all}
button{font:inherit;font-weight:700;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
p{margin:0}.muted{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1 style="margin:0;font-size:24px">쓰레드 자동 게시 연결</h1>
<section class="card" id="start">
  <p><b>1.</b> Meta 개발자 앱의 <b>Threads 앱 ID</b>를 넣고 연결을 시작하세요.</p>
  <input id="app" inputmode="numeric" placeholder="Threads 앱 ID (숫자)">
  <button id="go">쓰레드로 연결 시작</button>
  <p class="muted">이 페이지는 아무것도 저장하거나 보내지 않아요. 앱 ID는 공개 값이에요(시크릿 아님).</p>
</section>
<section class="card" id="done" hidden>
  <p><b>2.</b> 아래 코드를 복사해 GitHub → jsbars-calc-data → Actions → <b>쓰레드 계정 연결 (처음 1번)</b> → Run workflow 칸에 붙여 넣으세요. <b>1시간 안에</b> 한 번만 쓸 수 있어요.</p>
  <textarea id="code" readonly></textarea>
  <button id="copy">코드 복사</button>
</section>
<script>
(function () {
  var q = new URLSearchParams(location.search), code = (q.get("code") || "").replace(/#_?$/, "");
  if (code) {
    document.getElementById("start").hidden = true; document.getElementById("done").hidden = false;
    document.getElementById("code").value = code;
    history.replaceState(null, "", location.pathname);   // 주소창에서 코드 지우기
  } else if (q.get("error")) {
    document.getElementById("start").insertAdjacentHTML("afterbegin", "<p><b>연결이 취소됐거나 실패했어요.</b> 다시 시도해 주세요.</p>");
  }
  document.getElementById("go").addEventListener("click", function () {
    var app = document.getElementById("app").value.trim();
    if (!/^\d+$/.test(app)) { alert("숫자로 된 Threads 앱 ID를 넣어 주세요."); return; }
    location.href = "https://threads.com/oauth/authorize?" + new URLSearchParams({
      client_id: app, redirect_uri: location.origin + location.pathname,
      scope: "threads_basic,threads_content_publish,threads_manage_replies", response_type: "code"
    }).toString();
  });
  document.getElementById("copy").addEventListener("click", function () {
    var t = document.getElementById("code"); t.select();
    (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(function () { document.getElementById("copy").textContent = "복사됨"; }, function () { document.execCommand("copy"); document.getElementById("copy").textContent = "복사됨"; });
  });
})();
</script>
</main>
</body>
</html>
